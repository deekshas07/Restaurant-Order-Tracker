version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: restaurant-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: restaurant-mongo
    restart: always
    ports:
      - "27017:27017"

  redis:
    image: redis:7
    container_name: restaurant-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: